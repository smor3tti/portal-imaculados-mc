<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Imaculados M.C.</title>
<style>
:root{
  --bg:#0d0d0d;
  --surface:#161616;
  --surface-2:#1e1e1e;
  --border:#2a2a2a;
  --border-strong:#3a3a3a;
  --gold:#d4af37;
  --gold-light:#e6c14f;
  --gold-dark:#b8912c;
  --cream:#f2e6c9;
  --muted:#9a9a9a;
  --muted-2:#6f6f6f;
  --danger:#e2574c;
  --vermelho:#8B1E1E;
  --success:#4f9d6c;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh;}
.display{font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:900;letter-spacing:3px;text-transform:uppercase;}
.mono{font-family:"SF Mono","Consolas","Courier New",monospace;}
button,input{font-family:inherit;}
::selection{background:var(--gold);color:#0d0d0d;}

/* ---------- Login ---------- */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
.login-card{background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:42px 36px;width:100%;max-width:380px;text-align:center;}
.crest-wrap{margin:0 auto 16px;width:120px;height:120px;}
.crest-wrap img{width:100%;height:100%;}
.titulo-clube{color:var(--gold);font-size:21px;margin-bottom:4px;}
.subtitulo-login{color:var(--muted);font-size:11px;letter-spacing:2px;margin-bottom:26px;text-transform:uppercase;}
.campo{text-align:left;margin-bottom:14px;}
.campo label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.campo input,.campo select{width:100%;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;padding:11px 12px;color:var(--cream);font-size:14px;}
.campo input:focus,.campo select:focus{outline:none;border-color:var(--gold);}
.btn-entrar{width:100%;background:var(--gold);color:#0d0d0d;border:none;border-radius:8px;padding:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:13px;cursor:pointer;margin-top:8px;}
.btn-entrar:hover{background:var(--gold-light);}
.erro-login{color:var(--danger);font-size:12px;margin-top:14px;min-height:14px;}
.dica-login{color:var(--muted-2);font-size:11px;margin-top:24px;line-height:1.7;border-top:1px solid var(--border);padding-top:16px;}
.dica-login b{color:var(--muted);}

/* ---------- App shell ---------- */
#app-screen{display:none;min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:226px;background:#141414;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.sidebar-header{padding:24px 20px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
.sidebar-header .crest-wrap{width:44px;height:44px;margin:0;flex-shrink:0;}
.sidebar-header .nome-clube{font-size:12.5px;letter-spacing:2px;color:var(--gold);line-height:1.4;}
.sidebar nav{padding:16px 10px;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;border-left:3px solid transparent;color:#d8d8d8;padding:11px 14px;font-size:13px;border-radius:6px;cursor:pointer;margin-bottom:4px;}
.nav-item:hover{background:#232016;color:var(--gold);}
.nav-item.ativo{background:#2a2410;color:var(--gold);font-weight:600;border-left-color:var(--gold);}
.sidebar-footer{padding:16px;border-top:1px solid var(--border);}
.btn-sair{width:100%;background:transparent;border:1px solid var(--border-strong);color:var(--muted);padding:10px;border-radius:8px;font-size:12px;cursor:pointer;}
.btn-sair:hover{border-color:var(--danger);color:var(--danger);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--border);gap:16px;flex-wrap:wrap;}
.saudacao{font-size:17px;font-weight:600;}
.saudacao span{color:var(--gold);}
.badge-cargo{font-size:10px;color:var(--muted);border:1px solid var(--border-strong);padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;}
.content{padding:26px 32px 40px;flex:1;overflow-y:auto;}

.demo-banner{background:#1b1704;border:1px solid var(--gold-dark);color:var(--muted);font-size:12px;padding:11px 14px;border-radius:8px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.demo-banner b{color:var(--gold);}
.demo-banner .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.demo-banner input{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:6px;padding:7px 9px;color:var(--cream);font-size:12px;width:230px;}
.demo-banner input:focus{outline:none;border-color:var(--gold);}
.demo-banner button{background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:7px 13px;font-size:11px;cursor:pointer;white-space:nowrap;}
.demo-banner button:hover{background:var(--gold);color:#0d0d0d;}

.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:30px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;}
.card-titulo{color:var(--muted);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.card-valor{color:var(--gold);font-size:25px;font-weight:700;}
.card-sub{color:var(--muted-2);font-size:11px;margin-top:6px;}
.progress{background:var(--surface-2);border-radius:6px;height:8px;margin-top:12px;overflow:hidden;}
.progress-chunk{background:var(--gold);height:100%;border-radius:6px;}

.painel-titulo{font-size:18px;font-weight:700;margin-bottom:4px;}
.painel-sub{color:var(--muted);font-size:12px;margin-bottom:20px;}

.toolbar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.toolbar input[type=text]{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;padding:9px 12px;color:var(--cream);font-size:13px;width:240px;}
.toolbar input:focus{outline:none;border-color:var(--gold);}
.tabs{display:flex;gap:6px;}
.tab{background:transparent;border:1px solid var(--border-strong);color:var(--muted);padding:8px 14px;border-radius:20px;font-size:12px;cursor:pointer;}
.tab.ativo{border-color:var(--gold);color:var(--gold);background:#1c1808;}
.btn-primario{margin-left:auto;background:var(--gold);color:#0d0d0d;border:none;border-radius:8px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-primario:hover{background:var(--gold-light);}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;}
table{width:100%;border-collapse:collapse;background:var(--surface);min-width:560px;}
thead{background:#1c1c1c;}
th{text-align:left;padding:12px 16px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;white-space:nowrap;}
td{padding:13px 16px;font-size:13px;border-top:1px solid var(--border);color:var(--cream);white-space:nowrap;}
tr:hover td{background:#191919;}
.status-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.status-ativo{background:rgba(79,157,108,0.15);color:var(--success);}
.status-inativo{background:rgba(139,30,30,0.35);color:#ff8478;}
.status-pago{background:rgba(79,157,108,0.15);color:var(--success);}
.status-pendente{background:rgba(139,30,30,0.35);color:#ff8478;}
.card-financeiro{border-left:3px solid var(--vermelho);}
.acao-link{background:none;border:none;color:var(--gold);font-size:12px;cursor:pointer;font-weight:600;padding:0;}
.acao-link:hover{text-decoration:underline;}
.vazio{text-align:center;color:var(--muted);padding:32px;font-size:13px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.62);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal h3{font-size:16px;margin-bottom:18px;color:var(--gold);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal .campo{margin-bottom:12px;}
.modal-acoes{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.btn-secundario{background:transparent;border:1px solid var(--border-strong);color:var(--muted);padding:9px 16px;border-radius:8px;font-size:12px;cursor:pointer;}
.btn-secundario:hover{border-color:var(--cream);color:var(--cream);}

@media (max-width:760px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;}
  .sidebar-header{display:none;}
  .sidebar nav{display:flex;padding:8px;}
  .sidebar-footer{display:none;}
  .content{padding:20px 16px;}
  .grid-2{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="crest-wrap" id="crest-login"></div>
    <div class="subtitulo-login">Portal de gestão da irmandade</div>
    <form id="form-login" onsubmit="return handleLogin(event)">
      <div class="campo">
        <label for="in-login">Usuário</label>
        <input type="text" id="in-login" autocomplete="username" placeholder="login">
      </div>
      <div class="campo">
        <label for="in-senha">Senha</label>
        <input type="password" id="in-senha" autocomplete="current-password" placeholder="senha">
      </div>
      <button type="submit" class="btn-entrar">Entrar</button>
      <div class="erro-login" id="erro-login"></div>
    </form>
    <div class="dica-login">
      <b>Modo demonstração:</b> use <b>presidente</b> / <b>imaculados123</b>.<br>
      Para conectar ao backend real, faça login normalmente após configurar a URL da API no topo do painel.
    </div>
  </div>
</div>

<div id="app-screen">
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="crest-wrap" id="crest-sidebar"></div>
        <div class="nome-clube display">Painel<br>Administrativo</div>
      </div>
      <nav id="nav-menu"></nav>
      <div class="sidebar-footer">
        <button class="btn-sair" onclick="handleLogout()">Sair</button>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div class="saudacao">Olá, <span id="topo-nome"></span></div>
        <div class="badge-cargo" id="topo-cargo"></div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<div id="modal-root"></div>

/* ============ Helpers ============ */
function fmtMoeda(v){ return 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtData(d){ if(!d) return '—'; var p=d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtDataHora(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return iso;
  var dia = String(d.getDate()).padStart(2,'0');
  var mes = String(d.getMonth()+1).padStart(2,'0');
  var hh = String(d.getHours()).padStart(2,'0');
  var mm = String(d.getMinutes()).padStart(2,'0');
  return dia+'/'+mes+' às '+hh+':'+mm;
}
function integranteNome(id){ var i=demoIntegrantes.find(function(x){return x.id===id;}); return i?(i.nome+' "'+i.apelido+'"'):('#'+id); }

async function apiFetch(path, options){
  options = options || {};
  options.headers = options.headers || {};
  options.headers['Content-Type'] = 'application/json';
  if(state.token) options.headers['Authorization'] = 'Bearer ' + state.token;
  var res = await fetch(state.apiBase.replace(/\/$/,'') + path, options);
  if(!res.ok){
    var err = await res.json().catch(function(){return {detail:'Erro na requisição'};});
    throw new Error(err.detail || 'Erro na requisição');
  }
  return res.status===204?null:res.json();
}

/* ============ Login ============ */
async function handleLogin(ev){
  ev.preventDefault();
  var login = document.getElementById('in-login').value.trim();
  var senha = document.getElementById('in-senha').value;
  var erroEl = document.getElementById('erro-login');
  erroEl.textContent = '';

  if(state.apiBase){
    try{
      var data = await apiFetch('/auth/login', {method:'POST', body:JSON.stringify({login:login, senha:senha})});
      state.token = data.access_token; state.cargo = data.cargo; state.nome = data.nome;
      state.screen='app'; state.view='dashboard';
      render();
    }catch(e){
      erroEl.textContent = 'Não foi possível conectar à API: ' + e.message;
    }
    return false;
  }

  if(login==='presidente' && senha==='imaculados123'){
    state.token='demo-token'; state.cargo='Presidente'; state.nome='Marcos "Falcão" Andrade';
    state.screen='app'; state.view='dashboard';
    render();
  } else {
    erroEl.textContent = 'Usuário ou senha inválidos (modo demo aceita presidente / imaculados123).';
  }
  return false;
}

function handleLogout(){
  state.token=null; state.cargo=null; state.nome=null; state.screen='login';

}

/* ============ Eventos ============ */
var TIPO_ICONE = {'Passeio':'🏍️','Encontro':'🤝','Churrasco':'🍖','Aniversário':'🎉','Outro':'📌'};

function statusPillClasseEvento(status){
  if(status==='Realizado') return 'status-ativo';
  if(status==='Cancelado') return 'status-inativo';
  return 'status-pago'; /* Planejado / Confirmado usam o verde de "positivo" */
}

async function renderEventos(body){
  body.innerHTML =
    '<div class="painel-titulo">Eventos</div>' +
    '<div class="painel-sub">Passeios, encontros, churrascos e aniversários da irmandade</div>' +
    '<div class="toolbar"><button class="btn-primario" onclick="abrirModalNovoEvento()">+ Novo evento</button></div>' +
    '<div class="cards-grid" id="grid-eventos"></div>';

  var lista = demoEventos;
  if(state.apiBase){
    try{ lista = await apiFetch('/eventos'); }catch(e){ /* mantém mock em caso de falha */ }
  }
  lista = lista.slice().sort(function(a,b){ return a.data < b.data ? -1 : 1; });

  var grid = document.getElementById('grid-eventos');
  if(!grid) return;
  if(lista.length===0){
    grid.innerHTML = '<div class="vazio">Nenhum evento cadastrado ainda.</div>';
    return;
  }

  grid.innerHTML = lista.map(function(ev){
    var presencasEv = demoPresencas[ev.id] || [];
    var totalConfirmados = ev.total_confirmados!==undefined ? ev.total_confirmados : presencasEv.filter(function(p){return p.confirmacao==='Confirmado';}).length;
    var minhaPresenca = presencasEv.find(function(p){return p.integrante_id===USUARIO_DEMO_ID;});
    var meuStatus = minhaPresenca ? minhaPresenca.confirmacao : 'Pendente';
    return '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">' +
        '<div class="card-titulo">'+(TIPO_ICONE[ev.tipo]||'📌')+' '+ev.tipo.toUpperCase()+'</div>' +
        '<span class="status-pill '+statusPillClasseEvento(ev.status)+'">'+ev.status+'</span>' +
      '</div>' +
      '<div style="font-size:16px;font-weight:700;color:var(--cream);margin:6px 0 2px;">'+ev.nome+'</div>' +
      '<div class="card-sub" style="margin-top:0;">'+fmtData(ev.data)+' · '+(ev.local||'Local a definir')+'</div>' +
      '<div style="font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.5;">'+(ev.descricao||'')+'</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;">' +
        '<button class="acao-link" onclick="verPresencas('+ev.id+')">'+totalConfirmados+' confirmado(s) — ver lista</button>' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-top:12px;">' +
        '<button class="tab '+(meuStatus==='Confirmado'?'ativo':'')+'" style="flex:1;text-align:center;" onclick="responderPresenca('+ev.id+',\'Confirmado\')">Vou</button>' +
        '<button class="tab '+(meuStatus==='Recusado'?'ativo':'')+'" style="flex:1;text-align:center;" onclick="responderPresenca('+ev.id+',\'Recusado\')">Não vou</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function responderPresenca(eventoId, resposta){
  if(state.apiBase){
    try{ await apiFetch('/eventos/'+eventoId+'/presenca', {method:'POST', body:JSON.stringify({confirmacao:resposta})}); }
    catch(e){ alert('Erro ao registrar presença: '+e.message); return; }
  }
  if(!demoPresencas[eventoId]) demoPresencas[eventoId] = [];
  var existente = demoPresencas[eventoId].find(function(p){return p.integrante_id===USUARIO_DEMO_ID;});
  if(existente) existente.confirmacao = resposta;
  else demoPresencas[eventoId].push({integrante_id:USUARIO_DEMO_ID, confirmacao:resposta});
  renderEventos(document.getElementById('view-body'));
}

async function verPresencas(eventoId){
  var evento = demoEventos.find(function(e){return e.id===eventoId;});
  var presencasEv = demoPresencas[eventoId] || [];
  if(state.apiBase){
    try{ presencasEv = await apiFetch('/eventos/'+eventoId+'/presencas'); }catch(e){}
  }
  var linhas = presencasEv.map(function(p){
    var nome = p.integrante_nome || integranteNome(p.integrante_id);
    var classe = p.confirmacao==='Confirmado' ? 'status-pago' : (p.confirmacao==='Recusado' ? 'status-pendente' : 'status-inativo');
    return '<tr><td>'+nome+'</td><td><span class="status-pill '+classe+'">'+p.confirmacao+'</span></td></tr>';
  }).join('') || '<tr><td colspan="2" class="vazio">Ninguém respondeu ainda.</td></tr>';

  document.getElementById('modal-root').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) fecharModal()">' +
      '<div class="modal">' +
        '<h3>Presença — '+(evento?evento.nome:'Evento')+'</h3>' +
        '<div class="table-wrap"><table><thead><tr><th>Integrante</th><th>Resposta</th></tr></thead><tbody>'+linhas+'</tbody></table></div>' +
        '<div class="modal-acoes"><button class="btn-secundario" onclick="fecharModal()">Fechar</button></div>' +
      '</div>' +
    '</div>';
}

    novo.id = Math.max.apply(null, demoComunicados.map(function(c){return c.id;})) + 1;
    novo.autor_id = USUARIO_DEMO_ID;
    novo.data = new Date().toISOString();
    demoComunicados.unshift(novo);
  }
  fecharModal();
  renderComunicados(document.getElementById('view-body'));
}

async function excluirComunicado(id){
  if(!confirm('Excluir este comunicado?')) return;
  if(state.apiBase){
    try{ await apiFetch('/comunicados/'+id, {method:'DELETE'}); }
    catch(e){ alert('Erro ao excluir na API: '+e.message); return; }
  } else {
    demoComunicados = demoComunicados.filter(function(c){return c.id!==id;});
  }
  renderComunicados(document.getElementById('view-body'));
}

/* ============ Início ============ */
render();
</script>
